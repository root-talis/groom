<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 680" font-family="monospace" font-size="13">
  <defs>
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#25272b" stroke-width="0.5"/>
    </pattern>

    <marker id="arrow_down" viewBox="0 0 8 8" refX="4" refY="8" markerWidth="6" markerHeight="6" orient="0">
      <path d="M 0 0 L 8 0 L 4 8 Z" fill="context-stroke"/>
    </marker>
    <marker id="arrow_right" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="0">
      <path d="M 0 0 L 0 8 L 8 4 Z" fill="context-stroke"/>
    </marker>
  </defs>

  <rect width="888" height="664" fill="#1d1f21"/>
  <rect width="888" height="664" fill="url(#grid)"/>

  <!-- Controller mod container -->
  <rect x="64" y="16" width="760" height="632" fill="#282a2e" stroke="#969896" stroke-width="1"/>
  <text x="444" y="40" fill="#b294bb" text-anchor="middle">#[Controller] mod</text>
  <text x="444" y="60" fill="#b294bb" font-size="11" font-style="italic" text-anchor="middle">generates into_router() with routes and OpenAPI fragments setup, and compile-time checks</text>

  <!-- into_router() entry -->
  <rect x="296" y="72" width="296" height="40" fill="#1d1f21" stroke="#969896" stroke-width="1"/>
  <text x="444" y="92" fill="#b294bb" text-anchor="middle">into_router()</text>
  <text x="444" y="104" fill="#969896" text-anchor="middle" font-size="10">generated static method → GroomRouter</text>

  <!-- arrow: into_router() → GroomRouter -->
  <polyline points="444,112 444,120" fill="none" stroke="#969896" stroke-width="1" marker-end="url(#arrow_down)"/>

  <!-- GroomRouter<S, NotValidated> central box -->
  <rect x="200" y="128" width="488" height="56" fill="#1d1f21" stroke="#969896" stroke-width="1"/>
  <text x="444" y="150" fill="#de935f" text-anchor="middle">GroomRouter&lt;S, NotValidated&gt;</text>
  <text x="444" y="168" fill="#969896" text-anchor="middle" font-size="10">.merge() / .nest() composition</text>

  <!-- arrow + validate -->
  <polyline points="444,184 444,208" fill="none" stroke="#969896" stroke-width="1" marker-end="url(#arrow_down)"/>
  <text x="452" y="196" fill="#969896" text-anchor="start" font-size="11">.validate() → Result&lt;_, RouterValidationError&gt;</text>

  <!-- GroomRouter<S, Validated> -->
  <rect x="256" y="216" width="376" height="48" fill="#1d1f21" stroke="#969896" stroke-width="1"/>
  <text x="444" y="236" fill="#de935f" text-anchor="middle">GroomRouter&lt;S, Validated&gt;</text>
  <text x="444" y="252" fill="#969896" text-anchor="middle" font-size="10">validation gate passed</text>

  <!-- fork: GroomRouter → two outputs -->
  <polyline points="444,264 444,272" fill="none" stroke="#969896" stroke-width="1"/>
  <polyline points="444,272 236,272 236,280" fill="none" stroke="#969896" stroke-width="1" marker-end="url(#arrow_down)"/>
  <polyline points="444,272 652,272 652,280" fill="none" stroke="#969896" stroke-width="1" marker-end="url(#arrow_down)"/>

  <!-- to_axum_router() output -->
  <rect x="96" y="280" width="280" height="48" fill="#1d1f21" stroke="#969896" stroke-width="1"/>
  <text x="236" y="300" fill="#de935f" text-anchor="middle">axum::Router&lt;S&gt;</text>
  <text x="236" y="316" fill="#969896" text-anchor="middle" font-size="10">to_axum_router()</text>

  <!-- to_openapi() output -->
  <rect x="512" y="280" width="280" height="48" fill="#1d1f21" stroke="#969896" stroke-width="1"/>
  <text x="652" y="300" fill="#81a2be" text-anchor="middle">OpenApi</text>
  <text x="652" y="316" fill="#969896" text-anchor="middle" font-size="10">to_openapi(api)</text>

  <!-- merge / per-request divider -->
  <line x1="88" y1="368" x2="800" y2="368" stroke="#969896" stroke-width="1"/>
  <text x="444" y="384" fill="#c5c8c6" text-anchor="middle" font-size="11">per request:</text>

  <!-- __groom_wrapper_your_handler container -->
  <rect x="88" y="400" width="712" height="248" fill="#1d1f21" stroke="#969896" stroke-width="1"/>
  <text x="112" y="424" fill="#c5c8c6">
    <tspan>__groom_wrapper_your_handler(</tspan>
    <tspan fill="#8abeb7">headers: HeaderMap, </tspan>
    <tspan fill="#b5bd68">Extractor(arg): Extractor&lt;DTO&gt;...</tspan>
    <tspan fill="#c5c8c6">)</tspan>
  </text>

  <!-- 1) parse Accept header -->
  <rect x="112" y="448" width="664" height="40" fill="#282a2e" stroke="#969896" stroke-width="1"/>
  <text x="128" y="464" fill="#8abeb7">1) read headers: HeaderMap</text>
  <text x="128" y="480" fill="#969896" font-size="10">parse Accept, content negotiation input</text>

  <polyline points="444,488 444,496" fill="none" stroke="#969896" stroke-width="1" marker-end="url(#arrow_down)"/>

  <!-- 2) your_handler -->
  <rect x="112" y="504" width="664" height="48" fill="#282a2e" stroke="#969896" stroke-width="1"/>
  <text x="128" y="522" fill="#b5bd68">2) your_handler(Extractor(arg): Extractor&lt;DTO&gt;...)</text>
  <text x="128" y="538" fill="#969896" font-size="10">#[Route] async fn -&gt; ResponseType</text>

  <polyline points="444,552 444,560" fill="none" stroke="#969896" stroke-width="1" marker-end="url(#arrow_down)"/>

  <!-- 3) __groom_into_response -->
  <rect x="112" y="568" width="664" height="56" fill="#282a2e" stroke="#969896" stroke-width="1"/>
  <text x="128" y="586" fill="#cc6666">3) Response::__groom_into_response(accept)</text>
  <text x="128" y="602" fill="#969896" font-size="10">3.1) pick format, or 400</text>
  <text x="128" y="616" fill="#969896" font-size="10">3.2) pick status, from #[Response(code = ...)]</text>
</svg>
